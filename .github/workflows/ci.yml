name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15.0rc2"
      - name: Allow tox to build packages from source
        run: |
          echo "PIP_NO_BINARY=greenlet,hypothesis,pyyaml" >> $GITHUB_ENV
          echo "PYYAML_FORCE_CYTHON=0" >> $GITHUB_ENV
          echo "HYPOTHESIS_NO_EXTENSION=1" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          uv pip install "cython>=3.0.11" --system --python 3.15
          uv pip install "greenlet>=3.1.1" --system --python 3.15 --no-binary greenlet
          uv sync --all-extras --dev
      - name: Run Ruff Linter
        run: uv run ruff check
      - name: Run Ruff Formatter
        run: uv run ruff format --check
      - name: Run Markdown Formatter
        run: uv run mdformat --check src tests docs *.md
      - name: Run Type Checker
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.15.0rc2"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Allow tox to build packages from source
        if: matrix.python-version == '3.15.0rc2'
        run: |
          echo "PIP_NO_BINARY=greenlet,hypothesis,pyyaml" >> $GITHUB_ENV
          echo "PYYAML_FORCE_CYTHON=0" >> $GITHUB_ENV
          echo "HYPOTHESIS_NO_EXTENSION=1" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          uv pip install "cython>=3.0.11" --system --python 3.15
          uv pip install "greenlet>=3.1.1" --system --python 3.15 --no-binary greenlet
          uv sync --all-extras --dev
      - name: Run Tests
        continue-on-error: true
        run: |
          VERSION="3.15"
          TOX_ENV="py${VERSION//./}"
          uv run tox -e $TOX_ENV
