repos:
  - repo: local
    hooks:
      - id: uv-audit
        name: uv audit
        entry: uv audit
        language: system
        pass_filenames: false
        always_run: true
      - id: mdformat
        name: mdformat
        entry: uv run mdformat
        language: system
        types: [markdown]
        exclude: ^(\.venv|\.tox|reports|plans|prompts|build|dist)/
